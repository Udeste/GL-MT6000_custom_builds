##############################################################################
# User custom options added in the server: clause part of UCI 'unbound.conf'
#
# Add your own option statements here when they are not covered by UCI. This
# file is placed _inside_ the server: clause with an include: statement. Do
# not start other clauses here, because that would break the server: clause.
# Use 'unbound_ext.conf' to start new clauses at the end of 'unbound.conf'.
##############################################################################
interface: 0.0.0.0       # listen on all IPv4 interfaces
interface: ::0            # listen on all IPv6 interfaces

msg-cache-slabs: 4
rrset-cache-slabs: 4
infra-cache-slabs: 4
key-cache-slabs: 4
ratelimit-slabs: 4
ip-ratelimit-slabs: 4
so-reuseport: yes

rrset-cache-size: 128m
msg-cache-size: 64m
key-cache-size: 32m
neg-cache-size: 16m

outgoing-range: 8192
num-queries-per-thread: 4096

# private-domain and local-data records are appended below at first boot by
# /etc/uci-defaults/91_my_unbound_localdata, read from U-Boot env
# (unbound_private_domain = "<domain>", unbound_localN = "<fqdn> <ipv4> [<ipv6>]").